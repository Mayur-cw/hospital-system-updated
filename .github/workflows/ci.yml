name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-security:
    name: Lint & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff Linter
        run: ruff check hms/ tests/

      - name: Run Supply Chain Audit (pip-audit)
        run: pip-audit

      - name: Verify WCAG 2.2 AA Color Contrast
        run: python tools/check_contrast.py

  test-suite:
    name: Integration & Unit Tests (MySQL 8)
    runs-on: ubuntu-latest
    needs: lint-and-security
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: RootPassword@123
          MYSQL_DATABASE: hms_test
          MYSQL_USER: hms_user
          MYSQL_PASSWORD: TestPassword@123
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Database Migrations
        env:
          DATABASE_URL: mysql+pymysql://hms_user:TestPassword@123@127.0.0.1:3306/hms_test
        run: |
          flask db upgrade

      - name: Run Pytest with Coverage Gate (>= 85%)
        env:
          INTEGRATION_DATABASE_URL: mysql+pymysql://hms_user:TestPassword@123@127.0.0.1:3306/hms_test
        run: |
          pytest --cov=hms/services --cov=hms/policies --cov-fail-under=85 tests/
