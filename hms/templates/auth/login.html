{% extends 'layouts/public.html' %}

{% block title %}Sign In | Hedgewar Hospital Care{% endblock title %}

{% block content %}
<div class="container py-5 my-auto">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="hms-card">
        <div class="hms-card-header flex-column text-center py-4">
          <div class="hms-avatar hms-avatar-lg mb-3">
            <i class="fa-solid fa-lock" aria-hidden="true"></i>
          </div>
          <h1 class="h4 mb-1">Account Sign In</h1>
          <p class="text-sm text-muted mb-0">Enter your credentials to access your hospital account</p>
        </div>

        <div class="hms-card-body p-4">
          <form action="{{ url_for('auth.login') }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

            <div class="hms-form-group">
              <label for="email" class="hms-label">Email Address</label>
              <input type="email" class="hms-input" id="email" name="email" placeholder="name@hedgewar.org" required autofocus autocomplete="email"/>
            </div>

            <div class="hms-form-group">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label for="password" class="hms-label mb-0">Password</label>
                <a href="{{ url_for('auth.forgot_password') }}" class="text-xs text-primary">Forgot Password?</a>
              </div>
              <input type="password" class="hms-input" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password"/>
            </div>

            <button type="submit" class="btn-hms btn-hms-primary w-100 btn-hms-lg mt-4">
              <i class="fa-solid fa-arrow-right-to-bracket" aria-hidden="true"></i>
              <span>Sign In</span>
            </button>
          </form>

          <div class="text-center mt-4 pt-3 border-top">
            <span class="text-sm text-muted">Don't have an account?</span>
            <a href="{{ url_for('auth.signup') }}" class="text-sm fw-bold ms-1">Register as a Patient</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
