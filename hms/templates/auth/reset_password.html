{% extends 'base.html' %}

{% block title %}Set New Password | Hedgewar Hospital{% endblock title %}

{% block body %}
<div class="container mt-5 mb-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow border-0 mt-3 rounded-4">
        <div class="card-header bg-dark text-white text-center py-4 rounded-top-4">
          <div class="rounded-circle bg-white bg-opacity-10 d-inline-flex p-3 mb-2">
            <i class="fas fa-lock fa-2x text-success"></i>
          </div>
          <h4 class="mb-0 fw-bold">Set New Password</h4>
        </div>
        
        <div class="card-body p-4 bg-light rounded-bottom-4">
          <p class="text-muted text-center mb-4">Please choose a secure new passphrase with at least 10 characters.</p>

          <form action="{{ url_for('auth.reset_password', token=token) }}" method="POST">
            {{ csrf_field() }}
            
            <div class="mb-3">
              <label for="password" class="form-label fw-bold">New Password</label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="fas fa-lock text-muted"></i></span>
                <input type="password" class="form-control" id="password" name="password" minlength="10" placeholder="Minimum 10 characters" required autofocus>
              </div>
              <div class="form-text small text-muted">Must be at least 10 characters long. Avoid common words.</div>
            </div>

            <div class="mb-4">
              <label for="confirm_password" class="form-label fw-bold">Confirm Password</label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="fas fa-check text-muted"></i></span>
                <input type="password" class="form-control" id="confirm_password" name="confirm_password" minlength="10" placeholder="Re-enter new password" required>
              </div>
            </div>
            
            <div class="d-grid mb-3">
              <button type="submit" class="btn btn-primary btn-lg shadow-sm rounded-pill fw-bold">
                Update Password <i class="fas fa-shield-alt ms-2"></i>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock body %}
