{% extends 'layouts/public.html' %}

{% block title %}Set New Password | Hedgewar Hospital Care{% endblock title %}

{% block content %}
<div class="container py-5 my-auto">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="hms-card">
        <div class="hms-card-header flex-column text-center py-4">
          <div class="hms-avatar hms-avatar-lg mb-3">
            <i class="fa-solid fa-lock" aria-hidden="true"></i>
          </div>
          <h1 class="h4 mb-1">Set New Password</h1>
          <p class="text-sm text-muted mb-0">Choose a strong passphrase with at least 10 characters</p>
        </div>

        <div class="hms-card-body p-4">
          <form action="{{ url_for('auth.reset_password', token=token) }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

            <div class="hms-form-group">
              <label for="password" class="hms-label">New Password</label>
              <input type="password" class="hms-input" id="password" name="password" minlength="10" placeholder="Minimum 10 characters" required autofocus autocomplete="new-password"/>
              <div class="hms-hint">Must be at least 10 characters long. Avoid common passwords.</div>
            </div>

            <div class="hms-form-group">
              <label for="confirm_password" class="hms-label">Confirm New Password</label>
              <input type="password" class="hms-input" id="confirm_password" name="confirm_password" minlength="10" placeholder="Re-enter new password" required autocomplete="new-password"/>
            </div>

            <button type="submit" class="btn-hms btn-hms-primary w-100 btn-hms-lg mt-4">
              <i class="fa-solid fa-shield-halved" aria-hidden="true"></i>
              <span>Update Password</span>
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
