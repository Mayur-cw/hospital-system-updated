{% extends 'base.html' %}

{% block title %}Forgot Password | Hedgewar Hospital{% endblock title %}

{% block body %}
<div class="container mt-5 mb-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow border-0 mt-3 rounded-4">
        <div class="card-header bg-dark text-white text-center py-4 rounded-top-4">
          <div class="rounded-circle bg-white bg-opacity-10 d-inline-flex p-3 mb-2">
            <i class="fas fa-key fa-2x text-warning"></i>
          </div>
          <h4 class="mb-0 fw-bold">Reset Password</h4>
        </div>
        
        <div class="card-body p-4 bg-light rounded-bottom-4">
          <p class="text-muted text-center mb-4">Enter your registered email address and we'll send you a secure verification link to reset your credentials.</p>

          <form action="{{ url_for('auth.forgot_password') }}" method="POST">
            {{ csrf_field() }}
            
            <div class="mb-4">
              <label for="email" class="form-label fw-bold">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="fas fa-envelope text-muted"></i></span>
                <input type="email" class="form-control" id="email" name="email" placeholder="name@hedgewar.local" required autofocus>
              </div>
            </div>
            
            <div class="d-grid mb-3">
              <button type="submit" class="btn btn-dark btn-lg shadow-sm rounded-pill fw-bold">
                Send Reset Link <i class="fas fa-paper-plane ms-2"></i>
              </button>
            </div>
            
            <div class="text-center">
              <a href="{{ url_for('auth.login') }}" class="text-muted text-decoration-none small">
                <i class="fas fa-arrow-left me-1"></i> Back to Login
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock body %}
