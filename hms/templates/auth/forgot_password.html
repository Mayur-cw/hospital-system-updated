{% extends 'layouts/public.html' %}

{% block title %}Forgot Password | Hedgewar Hospital Care{% endblock title %}

{% block content %}
<div class="container py-5 my-auto">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="hms-card">
        <div class="hms-card-header flex-column text-center py-4">
          <div class="hms-avatar hms-avatar-lg mb-3">
            <i class="fa-solid fa-key" aria-hidden="true"></i>
          </div>
          <h1 class="h4 mb-1">Reset Password</h1>
          <p class="text-sm text-muted mb-0">Enter your registered email address to receive a secure recovery link</p>
        </div>

        <div class="hms-card-body p-4">
          <form action="{{ url_for('auth.forgot_password') }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

            <div class="hms-form-group">
              <label for="email" class="hms-label">Email Address</label>
              <input type="email" class="hms-input" id="email" name="email" placeholder="name@hedgewar.org" required autofocus autocomplete="email"/>
            </div>

            <button type="submit" class="btn-hms btn-hms-primary w-100 btn-hms-lg mt-4">
              <i class="fa-solid fa-paper-plane" aria-hidden="true"></i>
              <span>Send Recovery Link</span>
            </button>
          </form>

          <div class="text-center mt-4 pt-3 border-top">
            <a href="{{ url_for('auth.login') }}" class="text-sm text-muted">
              <i class="fa-solid fa-arrow-left me-1" aria-hidden="true"></i> Back to Sign In
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
